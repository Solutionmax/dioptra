name: Build and test browser
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:browser
      - if: runner.os == 'macOS'
        run: npm run test:browser
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:workspace
      - if: runner.os == 'macOS'
        run: npm run test:workspace
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:claude-session
      - if: runner.os == 'macOS'
        run: npm run test:claude-session
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - if: runner.os == 'macOS'
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: dioptra-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.tar.gz
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
            artifacts/*.png
